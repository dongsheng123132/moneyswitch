packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # 13.0.3 bundles N-API binaries for supported targets. pnpm 10 may
  # synthesize node-gyp rebuild despite gypfile:false; use those binaries.
  better-sqlite3: false
  esbuild: true
patchedDependencies:
  '@solana/rpc-transport-http@5.1.0': patches/@solana__rpc-transport-http@5.1.0.patch
