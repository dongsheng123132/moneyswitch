services:
  server:
    image: ${MONEYSWITCH_IMAGE:-moneyswitch:local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "127.0.0.1:${MONEYSWITCH_LOCAL_PORT:-4020}:4020"
    environment:
      MONEYSWITCH_PUBLIC_URL: ${MONEYSWITCH_PUBLIC_URL:-http://localhost:4020}
      MONEYSWITCH_NETWORKS: ${MONEYSWITCH_NETWORKS:-eip155:10143,eip155:84532}
      MONEYSWITCH_DEFAULT_NETWORK: ${MONEYSWITCH_DEFAULT_NETWORK:-eip155:10143}
      MONEYSWITCH_WALLET_PASSWORD_FILE: /run/secrets/wallet_password
    volumes:
      - moneyswitch-data:/data
    secrets:
      - wallet_password
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  moneyswitch-data:

secrets:
  wallet_password:
    file: ${MONEYSWITCH_WALLET_PASSWORD_PATH:-./deploy/secrets/wallet_password}
